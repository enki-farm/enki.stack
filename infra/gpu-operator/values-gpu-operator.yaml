# NVIDIA GPU Operator values for DGX Spark (DGX OS ships the driver already).
driver:
  enabled: false

toolkit:
  enabled: true

devicePlugin:
  enabled: true

dcgmExporter:
  enabled: true
  # Requires the prometheus-operator CRDs from infra/monitoring/install-monitoring.sh.
  serviceMonitor:
    enabled: true
    interval: 30s

gfd:
  enabled: true

nodeStatusExporter:
  enabled: true

# Single-node box: no need to restrict to specific node labels/taints.
operator:
  defaultRuntime: containerd
