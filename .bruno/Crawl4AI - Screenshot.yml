info:
  name: Crawl4AI - Screenshot
  type: http
  seq: 12

http:
  method: POST
  url: "{{CRAWL4AI_URL}}/screenshot"
  body:
    type: json
    data: |-
      {
        "url": "https://example.com",
        "screenshot_wait_for": 2
      }
  auth:
    type: bearer
    token: "{{process.env.CRAWL4AI_API_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
