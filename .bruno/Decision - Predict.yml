info:
  name: Decision - Predict
  type: http
  seq: 6

http:
  method: POST
  url: "{{AI_URL}}/typesafe/v1/systemone"
  body:
    type: json
    data: |-
      {
        "model": "decision",
        "state": {
          "ticket": "I was charged twice for order #4471."
        },
        "questions": {
          "is_billing": {
            "type": "noul",
            "instructions": "Is this ticket about billing?"
          },
          "team": {
            "type": "choice",
            "instructions": "Which team should handle this?",
            "criteria": {
              "billing": null,
              "shipping": null,
              "other": null
            }
          }
        }
      }
  auth:
    type: bearer
    token: "{{process.env.ENKI_STACK_AI_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
