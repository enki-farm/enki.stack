info:
  name: SearXNG - Search JSON
  type: http
  seq: 30

http:
  method: GET
  url: '{{searxngUrl}}/search?q=kubernetes&format=json&engines=startpage,mojeek,yahoo,presearch,google,bing'
  params:
    - name: q
      value: kubernetes
      type: query
    - name: format
      value: json
      type: query
    - name: engines
      value: startpage,mojeek,yahoo,presearch,google,bing
      type: query

docs: |-
  Port-forward: kubectl -n searxng port-forward svc/searxng 8080:8080

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns JSON results", function() {
          expect(res.status).to.equal(200);
          expect(res.body.results).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
