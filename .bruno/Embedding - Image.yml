info:
  name: Embedding - Image
  type: http
  seq: 5

http:
  method: POST
  url: "{{AI_URL}}/v2/embed"
  headers:
    - name: x-client-id
      value: demo-client-b
      disabled: true
  body:
    type: json
    data: |-
      {
        "inputs": [
          {
            "content": [
              {
                "type": "image_url",
                "image_url": {
                  "url": "data:image/jpeg;base64,{{img_base64}}"
                }
              }
            ]
          }
        ],
        "model": "embedding"
      }
  auth:
    type: bearer
    token: "{{process.env.ENKI_STACK_AI_API_KEY}}"

runtime:
  variables:
    - name: img_base64
      value: 

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
