info:
  name: Crawl4AI - Health
  type: http
  seq: 8

http:
  method: GET
  url: "{{CRAWL4AI_URL}}/health"
  auth:
    type: bearer
    token: "{{process.env.CRAWL4AI_API_TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("is healthy", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
