info:
  name: Firecrawl Shim - Scrape v1
  type: http
  seq: 16

http:
  method: POST
  url: "{{FIRECRAWL_URL}}/v1/scrape"
  body:
    type: json
    data: |-
      {
        "url": "https://example.com",
        "formats": ["markdown", "html", "links"],
        "excludeTags": ["nav", "footer"],
        "waitFor": 1000
      }
  auth:
    type: bearer
    token: "{{process.env.CRAWL4AI_API_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
