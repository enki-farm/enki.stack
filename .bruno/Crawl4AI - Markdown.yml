info:
  name: Crawl4AI - Markdown
  type: http
  seq: 9

http:
  method: POST
  url: "{{CRAWL4AI_URL}}/md"
  body:
    type: json
    data: |-
      {
        "url": "https://example.com",
        "f": "fit"
      }
  auth:
    type: bearer
    token: "{{process.env.CRAWL4AI_API_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
