info:
  name: Crawl4AI - LLM Markdown
  type: http
  seq: 11

http:
  method: POST
  url: "{{CRAWL4AI_URL}}/md"
  body:
    type: json
    data: |-
      {
        "url": "https://example.com",
        "f": "llm",
        "q": "Summarize the page in one sentence."
      }
  auth:
    type: bearer
    token: "{{process.env.CRAWL4AI_API_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Uses llm.provider openai/default against LLM_BASE_URL (https://ai.zer0.garden/v1).
