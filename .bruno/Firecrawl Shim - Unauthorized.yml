info:
  name: Firecrawl Shim - Unauthorized
  type: http
  seq: 17

http:
  method: POST
  url: "{{FIRECRAWL_URL}}/v2/scrape"
  body:
    type: json
    data: |-
      {
        "url": "https://example.com"
      }
  auth:
    type: bearer
    token: "{{process.env.FIRECRAWL_SHIM_API_KEY}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects a wrong API key", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
