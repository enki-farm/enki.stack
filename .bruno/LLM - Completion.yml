info:
  name: LLM - Completion
  type: http
  seq: 1

http:
  method: POST
  url: https://ai.zer0.garden/v1/chat/completions
  body:
    type: json
    data: |-
      {
        "model": "default",
        "messages": [
          {
            "role": "user",
            "content": "Short poem about k8s"
          }
        ],
        "max_tokens": 1024,
        "temperature": 0.9
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
