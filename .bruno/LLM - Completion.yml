info:
  name: LLM - Completion
  type: http
  seq: 1

http:
  method: POST
  url: "{{AI_URL}}/v1/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "fast",
        "messages": [
          {
            "role": "user",
            "content": "Wo ist das Endlager?"
          }
        ],
        //"max_tokens": 1024,
        "temperature": 0.9
      }
  auth:
    type: bearer
    token: "{{process.env.ENKI_STACK_AI_API_KEY}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
