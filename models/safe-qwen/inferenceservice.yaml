apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: safe-qwen
  namespace: inference
spec:
  predictor:
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:latest
        command:
          - vllm
        args:
          - serve
          - Qwen/Qwen2.5-0.5B-Instruct
          - --served-model-name
          - safe-qwen
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --max-model-len
          - "2048"
          - --gpu-memory-utilization
          - "0.8"
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"