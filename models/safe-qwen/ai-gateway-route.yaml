apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: safe-qwen-model
  namespace: inference
spec:
  hostnames:
    - ai.zer0.garden
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: envoy-ai-gateway-system
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: safe-qwen
      modelsOwnedBy: enki.stack
      backendRefs:
        - name: safe-qwen-backend
      timeouts:
        request: 30m