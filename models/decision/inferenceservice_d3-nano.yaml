apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: decision
  annotations:
    serving.kserve.io/deploymentMode: Standard
    networking.kserve.io/visibility: cluster-local
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    nodeSelector:
      kubernetes.io/arch: arm64
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:nightly
        command:
          - vllm
        args:
          - serve
          - vllm-sr/d3-nano
          - --served-model-name
          - decision
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --gpu-memory-utilization
          - "0.25"
        ports:
          - containerPort: 8080
        env:
          - name: HF_HOME
            value: /root/.cache/huggingface
          - name: HF_HUB_DISABLE_TELEMETRY
            value: "1"
        resources:
          requests:
            cpu: "2"
            memory: 2Gi
            nvidia.com/gpu.shared: "1"
          limits:
            cpu: "4"
            memory: 20Gi
            nvidia.com/gpu.shared: "1"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
          - name: model-cache
            mountPath: /root/.cache/huggingface
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: huggingface-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi