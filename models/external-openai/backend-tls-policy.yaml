apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: external-openai-tls
  namespace: inference
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: external-openai
  validation:
    wellKnownCACertificates: System
    hostname: api.openai.com
