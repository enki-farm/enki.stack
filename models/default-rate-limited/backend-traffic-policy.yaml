apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: default-rate-limited-tokens
  namespace: inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: default-rate-limited-model
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-client-id
                  type: Distinct
          limit:
            requests: 1000
            unit: Minute
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token