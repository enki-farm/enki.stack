apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: default-rate-limited-model
  namespace: inference
spec:
  hostnames:
    - ai.zer0.garden
  parentRefs:
    - name: envoy-ai-gateway-basic
      kind: Gateway
      group: gateway.networking.k8s.io
      namespace: envoy-ai-gateway-system
      sectionName: https
  llmRequestCosts:
    - metadataKey: llm_total_token
      type: TotalToken
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: default-rate-limited
      modelsOwnedBy: enki.stack
      backendRefs:
        - name: default-backend
          modelNameOverride: default
      timeouts:
        request: 30m