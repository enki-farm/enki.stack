apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embedding-cohere-style
  namespace: inference
  labels:
    require-api-key: "true"
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      namespace: envoy-ai-gateway-system
  hostnames:
    - ai.zer0.garden
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2/embed
      backendRefs:
        - name: embedding-predictor
          port: 80