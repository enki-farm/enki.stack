# WAIT WITH DEPLOYMENT (at least on consumer gpus and GB10): https://github.com/vllm-project/vllm/issues/60847?
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: embeddinggemma2
  namespace: inference
spec:
  predictor:
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:nightly
        #imagePullPolicy: Always
        command:
          - vllm
        args:
          - serve
          - google/embeddinggemma-2
          - --served-model-name
          - embeddinggemma2
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --gpu-memory-utilization
          - "0.8"
          - --max-model-len
          - "1024"
          - --max-num-batched-tokens
          - "1024"
        ports:
          - containerPort: 8080
        env:
          - name: HF_HOME
            value: /root/.cache/huggingface
          - name: HF_HUB_DISABLE_TELEMETRY
            value: "1"
        resources:
          requests:
            cpu: "2"
            memory: 1Gi
            nvidia.com/gpu.shared: "1"
          limits:
            cpu: "4"
            memory: 60Gi
            nvidia.com/gpu.shared: "1"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
          - name: model-cache
            mountPath: /root/.cache/huggingface
          - name: shm
            mountPath: /dev/shm
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: huggingface-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi