# NVIDIA GPU Operator values for DGX Spark (DGX OS ships the driver already).
driver:
  enabled: false

toolkit:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

devicePlugin:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

dcgmExporter:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      # DCGM/NVML initialization needs more memory than steady-state collection.
      memory: 1Gi
  # The monitoring component owns scraping so this operator can install independently.
  serviceMonitor:
    enabled: false
    interval: 30s

gfd:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

nodeStatusExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

validator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Single-node box: no need to restrict to specific node labels/taints.
operator:
  defaultRuntime: containerd

node-feature-discovery:
  gc:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 1Gi
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 4Gi
  worker:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 512Mi
