# Sample InferenceService using KServe's built-in HuggingFace runtime +
# HuggingFace Hub pull-through (storageUri: hf://<repo>). Not part of the
# kustomize overlay — apply manually once the DGX Spark stack is up:
#   kubectl apply -f k8s/overlays/dgx-spark/examples/sample-inferenceservice.yaml
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sample-model
  namespace: ml-platform
spec:
  predictor:
    model:
      modelFormat:
        name: huggingface
      storageUri: "hf://Qwen/Qwen2.5-0.5B-Instruct"
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
