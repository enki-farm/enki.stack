apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AKS "production / larger deployments" overlay.
# Prereqs (not part of `kubectl apply -k`, run once per cluster):
#   infra/gateway/install-envoy-gateway.sh
#   infra/gateway/install-ai-gateway.sh
#   infra/monitoring/install-monitoring.sh --platform aks
resources:
  - ../../base
  - ../../cert-manager/deployment.yaml
  - ../../gateway-api/deployment.yaml
  - ../../gateway-api/gatewayclass.yaml
  - ../../gateway-api/gateway.yaml
  - ../../kserve
  - ../../monitoring
  - ../../addons/envoy-ai-gateway
  # Uncomment once the cluster has a GPU node pool (infra/aks/create-aks.sh --enable-gpu-pool):
  # - ../../aks
  # Uncomment when ready to flesh out the model registry addon:
  # - ../../addons/kubeflow-model-registry

labels:
  - pairs:
      app.kubernetes.io/part-of: enki-infer
      app.kubernetes.io/managed-by: kustomize
