apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      namespace: envoy-ai-gateway-system
      # No sectionName: attach to HTTP during bootstrap and HTTPS after TLS setup.
  hostnames:
    - grafana.zer0.garden
  rules:
    - backendRefs:
        - name: grafana
          port: 80
