apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-gateway-controller
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - envoy-ai-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway-helm
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
---
# Token usage (gen_ai_*) comes from the extproc process injected into each Envoy
# data-plane pod for an AIGatewayRoute.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ai-gateway-extproc
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: envoy-ai-gateway-basic
      gateway.envoyproxy.io/owning-gateway-namespace: envoy-ai-gateway-system
  podMetricsEndpoints:
    - targetPort: aigw-admin
      path: /metrics
      interval: 30s
