# Enables the Envoy proxy fleet's Prometheus endpoint. Only takes effect because
# k8s/gateway-api/gatewayclass.yaml points its parametersRef at this object.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: enki-proxy-config
  namespace: envoy-gateway-system
spec:
  telemetry:
    metrics:
      prometheus: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway-control-plane
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway-data-plane
  namespace: observability
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    # Envoy's own listener/upstream/HTTP stats.
    - targetPort: 19001
      path: /stats/prometheus
      interval: 30s
