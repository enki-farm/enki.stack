apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kserve-predictors
  namespace: observability
spec:
  # Predictors run in user namespaces (ml-platform and any future tenant ns).
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      component: predictor
  podMetricsEndpoints:
    # Scraped directly rather than through KServe's queue-proxy aggregator, which
    # stays disabled in k8s/kserve/kserve.yaml.
    - port: http
      path: /metrics
      interval: 30s
  podTargetLabels:
    - serving.kserve.io/inferenceservice
