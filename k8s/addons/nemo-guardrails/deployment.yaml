apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails
  namespace: inference
  labels:
    app.kubernetes.io/name: nemo-guardrails
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nemo-guardrails
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nemo-guardrails
    spec:
      containers:
        - name: nemo-guardrails
          image: ghcr.io/enki-farm/nemo-server:latest
          imagePullPolicy: Always
          env:
            - name: OPENAI_API_KEY
              value: local-no-auth
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/rails/configs
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /app/config/default/config.yml
              subPath: config.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nemo-guardrails-config