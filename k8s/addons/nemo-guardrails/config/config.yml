models:
  - type: main
    engine: openai
    model: safe-qwen
    api_key_env_var: OPENAI_API_KEY
    parameters:
      base_url: http://safe-qwen-predictor.inference.svc.cluster.local/v1

rails:
  config:
    regex_detection:
      input:
        patterns:
          - "\\bDilbert\\b"
        case_insensitive: true
  input:
    flows:
      - regex check input