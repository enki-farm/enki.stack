apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warpgate-operator-gateway-reader
  namespace: warpgate
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warpgate-operator-gateway-reader
  namespace: warpgate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warpgate-operator-gateway-reader
subjects:
  - kind: ServiceAccount
    name: warpgate-operator
    namespace: warpgate-operator