apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Requires the Envoy AI Gateway controller to already be installed via
# infra/gateway/install-envoy-gateway.sh + infra/gateway/install-ai-gateway.sh
# (kustomize alone can't drive the OCI helm charts through `kubectl apply -k`).
resources:
  - namespace.yaml
  - ai-gateway-route.yaml
