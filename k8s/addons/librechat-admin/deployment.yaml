apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-admin-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat-admin-panel
  template:
    metadata:
      labels:
        app: librechat-admin-panel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-panel
          image: ghcr.io/clickhouse/librechat-admin-panel@sha256:a395465d1daa3c11495810a8c224df86675985d50de42e98e36eeedbd8aecb94
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: librechat-admin-panel
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-admin-panel-session
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30