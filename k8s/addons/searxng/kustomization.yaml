apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The searxng-credentials Secret is created by install-searxng.sh.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: searxng-config
    namespace: searxng
    files:
      - settings.yml=config/settings.yml
