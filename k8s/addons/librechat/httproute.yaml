apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat
  namespace: librechat
spec:
  parentRefs:
    - name: envoy-ai-gateway-basic
      namespace: envoy-ai-gateway-system
      # No sectionName: attach to the shared HTTPS listener.
  hostnames:
    - chat.zer0.garden
  rules:
    - backendRefs:
        - name: librechat-librechat
          port: 3080
