apiVersion: v1
kind: Secret
metadata:
  name: anythingllm-secrets
  namespace: anythingllm
type: Opaque
stringData:
  JWT_SECRET: change-me-anythingllm-jwt-secret
  GENERIC_OPEN_AI_API_KEY: change-me-generic-openai-api-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anythingllm-storage
  namespace: anythingllm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anythingllm
  namespace: anythingllm
  labels:
    app.kubernetes.io/name: anythingllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anythingllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anythingllm
    spec:
      containers:
        - name: anythingllm
          image: mintplexlabs/anythingllm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: SERVER_PORT
              value: "3001"
            - name: STORAGE_DIR
              value: /app/server/storage
            - name: LLM_PROVIDER
              value: generic-openai
            - name: GENERIC_OPEN_AI_BASE_PATH
              value: https://ai.zer0.garden/v1
            - name: GENERIC_OPEN_AI_MODEL_PREF
              value: default
            - name: GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT
              value: "4096"
            - name: GENERIC_OPEN_AI_CUSTOM_HEADERS
              value: ""
            - name: GENERIC_OPEN_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anythingllm-secrets
                  key: GENERIC_OPEN_AI_API_KEY
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /app/server/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: anythingllm-storage
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
  namespace: anythingllm
spec:
  selector:
    app.kubernetes.io/name: anythingllm
  ports:
    - name: http
      port: 80
      targetPort: http
