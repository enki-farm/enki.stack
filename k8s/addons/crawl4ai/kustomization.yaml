apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The crawl4ai-credentials Secret is managed by enkictl addon install crawl4ai.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: crawl4ai-config
    namespace: crawl4ai
    files:
      - config.yml=config/config.yml
