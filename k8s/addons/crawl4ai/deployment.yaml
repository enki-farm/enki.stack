apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawl4ai
  namespace: crawl4ai
  labels:
    app.kubernetes.io/name: crawl4ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crawl4ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawl4ai
    spec:
      automountServiceAccountToken: false
      # The crawl4ai Service would inject CRAWL4AI_PORT=tcp://..., which the entrypoint reads as its port.
      enableServiceLinks: false
      containers:
        - name: crawl4ai
          image: unclecode/crawl4ai:0.9.2
          imagePullPolicy: IfNotPresent
          env:
            # Without a token the entrypoint binds loopback only and the Service is unreachable.
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crawl4ai-credentials
                  key: CRAWL4AI_API_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crawl4ai-credentials
                  key: OPENAI_API_KEY
            - name: LLM_BASE_URL
              value: https://ai.zer0.garden/v1
          ports:
            - name: api
              containerPort: 11235
          securityContext:
            # Image declares USER appuser by name; kubelet needs the numeric ID to verify runAsNonRoot.
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
        - name: firecrawl-shim
          image: ghcr.io/enki-farm/firecrawl-shim:latest
          imagePullPolicy: Always
          env:
            - name: CRAWL4AI_URL
              value: http://localhost:11235
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crawl4ai-credentials
                  key: CRAWL4AI_API_TOKEN
            - name: FIRECRAWL_SHIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crawl4ai-credentials
                  key: FIRECRAWL_SHIM_API_KEY
          ports:
            - name: firecrawl
              containerPort: 3002
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: firecrawl
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: firecrawl
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: crawl4ai-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
