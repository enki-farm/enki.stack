apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zer0-garden-wildcard-staging
  namespace: envoy-ai-gateway-system
spec:
  secretName: zer0-garden-wildcard-staging-tls
  issuerRef:
    name: zer0-azure-staging
    kind: ClusterIssuer
  dnsNames:
    - zer0.garden
    - "*.zer0.garden"