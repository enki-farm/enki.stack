apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeflow

resources:
- ../upstream/options/catalog/base
- postgres-pvc.yaml

# Replace sources with test sources
configMapGenerator:
- behavior: replace
  files:
  - sources.yaml=sources.yaml
  - mcp-servers.yaml=mcp-servers.yaml
  - agent-catalog.yaml=agent-catalog.yaml
  name: model-catalog-sources
  options:
    disableNameSuffixHash: true

patches:
- patch: |-
    apiVersion: v1
    kind: Secret
    metadata:
      name: model-catalog-postgres
    $patch: delete
- patch: |-
    apiVersion: v1
    kind: Secret
    metadata:
      name: model-catalog-hf-api-key
    $patch: delete
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: model-catalog-postgres
    spec:
      template:
        spec:
          containers:
          - name: postgres
            image: postgres:17.6-alpine
          volumes:
          - name: model-catalog-postgres
            emptyDir: null
            persistentVolumeClaim:
              claimName: model-catalog-postgres
