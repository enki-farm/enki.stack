apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-registry-ui-namespaces-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-registry-ui-namespaces-reader-binding
subjects:
  - kind: ServiceAccount
    name: model-registry-ui
    namespace: kubeflow
roleRef:
  kind: ClusterRole
  name: model-registry-ui-namespaces-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-reader
rules:
  - apiGroups: [""]
    resources: [namespaces, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-reader
subjects:
  - kind: Group
    name: enki-farm:core
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: hub-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-job-registry-reader
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [model-registry-service]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-job-registry-reader
subjects:
  - kind: User
    name: system:serviceaccount:kubeflow:default
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: hub-job-registry-reader
  apiGroup: rbac.authorization.k8s.io
