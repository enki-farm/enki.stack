apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow
resources:
  - namespace.yaml
  - ../upstream/overlays/db
  - ../catalog
  - ../zot
  - ../upstream/options/controller/overlays/base
  - ../upstream/options/csi
  - ../upstream/options/ui/base
  - kubeflow-dashboard-rbac.yaml
patches:
  - path: patches.yaml
images:
  - name: ghcr.io/kubeflow/hub/ui
    newName: ghcr.io/kubeflow/hub/ui-standalone
    newTag: v0.3.17
  - name: ghcr.io/kubeflow/hub/controller
    newTag: v0.3.17