apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway-basic
  namespace: envoy-ai-gateway-system
spec:
  gatewayClassName: envoy-ai-gateway-basic
  listeners:
    - name: https
      hostname: "*.zer0.garden"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: zer0-garden-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway-basic