apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat
  namespace: librechat
spec:
  parentRefs:
    - name: "@GATEWAY_NAME@"
      namespace: "@GATEWAY_NAMESPACE@"
  hostnames: ["@CHAT_HOST@"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: librechat-librechat, port: 3080}
