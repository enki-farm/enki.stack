apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat-admin-panel
  namespace: librechat
spec:
  parentRefs:
    - name: "@GATEWAY_NAME@"
      namespace: "@GATEWAY_NAMESPACE@"
      sectionName: https
  hostnames: ["@CHAT_ADMIN_HOST@"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: librechat-admin-panel
          port: 3000