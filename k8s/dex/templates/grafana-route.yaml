apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: "@GATEWAY_NAME@"
      namespace: "@GATEWAY_NAMESPACE@"
  hostnames: ["@GRAFANA_HOST@"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: grafana, port: 80}
