apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
spec:
  parentRefs:
    - name: "@GATEWAY_NAME@"
      namespace: "@GATEWAY_NAMESPACE@"
  hostnames: ["@DEX_HOST@"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: dex, port: 5556}
