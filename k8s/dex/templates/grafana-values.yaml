# Grafana values rendered by scripts/install-auth.sh; the role path is built from the group variables.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef: {name: oidc-credentials, key: client-secret}
grafana.ini:
  server:
    root_url: "@GRAFANA_URL@"
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: false
  auth.basic:
    # The datasource sidecar uses Basic auth for provisioning reloads.
    enabled: true
  auth.generic_oauth:
    enabled: true
    name: Dex
    auto_login: true
    allow_sign_up: true
    client_id: grafana
    scopes: openid profile email groups offline_access
    auth_url: "@DEX_ISSUER@/auth"
    token_url: "@DEX_ISSUER@/token"
    api_url: "@DEX_ISSUER@/userinfo"
    use_pkce: true
    use_refresh_token: true
    email_attribute_path: email
    login_attribute_path: email
    role_attribute_path: "@GRAFANA_ROLE_PATH@"
    role_attribute_strict: true
    allow_assign_grafana_admin: false
