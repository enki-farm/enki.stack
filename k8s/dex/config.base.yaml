# Dex core config; the CLI auth component fills at-sign tokens from the profile.
# The connector (the only provider-specific part) is appended from connector.yaml.
issuer: "@DEX_ISSUER@"
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db
web:
  http: 0.0.0.0:5556
telemetry:
  http: 0.0.0.0:5558
oauth2:
  grantTypes: [authorization_code, refresh_token]
  responseTypes: [code]
  skipApprovalScreen: true
expiry:
  idTokens: 10m
  signingKeys: 6h
  authRequests: 10m
  refreshTokens:
    validIfNotUsedFor: 24h
    absoluteLifetime: 168h
logger:
  level: info
  format: json
staticClients:
  - id: librechat
    name: LibreChat
    secretEnv: LIBRECHAT_CLIENT_SECRET
    redirectURIs: ["@CHAT_URL@/oauth/openid/callback"@ADMIN_CALLBACK@]
  - id: grafana
    name: Grafana
    secretEnv: GRAFANA_CLIENT_SECRET
    redirectURIs: ["@GRAFANA_URL@/login/generic_oauth"]
