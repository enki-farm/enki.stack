apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dex-ingress
  namespace: dex
spec:
  podSelector:
    matchLabels:
      app: dex
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 5556