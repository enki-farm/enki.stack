# Microsoft Entra ID connector. Copy beside your CLI profile and edit.
# Register an app in your tenant with redirect URI <issuer>/callback, add the
# delegated Directory.Read.All permission and grant admin consent (needed for groups):
#   https://login.microsoftonline.com/<tenant>/adminconsent?client_id=<client id>
# Put ENTRA_CLIENT_ID and ENTRA_CLIENT_SECRET under connector in the profile's
# secrets.yaml; the auth component stores $NAME values in dex-secrets.
# Use a tenant id or name, not "common"; groups only work with a specific tenant.
# Groups reach the apps as group display names (groupNameFormat: id yields object ids).
connectors:
  - type: microsoft
    id: entra
    name: Microsoft Entra ID
    config:
      clientID: $ENTRA_CLIENT_ID
      clientSecret: $ENTRA_CLIENT_SECRET
      redirectURI: "@DEX_ISSUER@/callback"
      tenant: 00000000-0000-0000-0000-000000000000
      emailToLowercase: true
      groups: [ai-users, observability-admins]
      useGroupsAsWhitelist: true
