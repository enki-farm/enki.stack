# GitHub connector. Copy beside your CLI profile and edit the org/teams.
# @DEX_ISSUER@ is filled in by the installer.
# Register an OAuth App at github.com/settings/developers with callback
# <issuer>/callback. Put GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET under connector
# in the profile's secrets.yaml; the auth component stores them in dex-secrets.
# Groups reach the apps as "<org>:<team-slug>"; members of no listed team cannot log in.
connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: "@DEX_ISSUER@/callback"
      teamNameField: slug
      orgs:
        - name: your-org
          teams: [ai-users, observability-admins]
