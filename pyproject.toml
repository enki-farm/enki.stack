[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enkictl"
version = "0.1.0"
description = "Profile-driven Helm and Kustomize deployment of enki.stack"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "typer>=0.16,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "cryptography>=45",
  "bcrypt>=4.3,<6",
  "questionary>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.12", "build>=1.2"]

[project.scripts]
enkictl = "enkictl.main:app"
enki-stack-helm-renderer = "enkictl.postrender:main"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["enkictl*"]

[tool.setuptools.package-data]
enkictl = ["helm_plugins/enki-stack/plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["cli/tests"]
pythonpath = ["cli"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
